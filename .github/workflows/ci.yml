# PRごとに test と lint を自動実行する最小のワークフロー。
# 「対策を入れた」と「対策が効いている」は別（横断テーマ6）を、
# ローカル実行ではなく機械的な歯止めにするのが目的。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチに続けてpushした時、古い実行を止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test + lint
    runs-on: ubuntu-latest

    steps:
      # AdrShapeTest が `**最終検証:**` の参照コミットを `git cat-file -e` で検証するため、
      # 浅いクローン（既定 depth=1）だと過去コミットが「存在しない」と誤判定される。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ローカルは Android Studio 同梱の JBR 21。CIも同じメジャーバージョンに揃える。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # instrumentation テストは実端末／エミュレータが要るのでCIでは実行しない。
      # ただしコンパイルは通しておく。ここが無いと、androidTest 側だけ壊れたまま
      # 誰も気付かない（ユニットテストとLintはどちらも androidTest を見ない）。
      - name: androidTest compile
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      # 失敗時に原因を追えるようレポートを残す。
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
